# Cloudflare Pages project: the pages (public/) + the API (functions/) + D1 database + R2 bucket
name = "team7-material-finder"
pages_build_output_dir = "./public"
compatibility_date = "2026-11-01"

# Plain settings, readable by the functions as env.MODEL_URL
[vars]
# The model server (02_model_server) on Render, without a slash at the end
MODEL_URL = "https://team7-material-finder.onrender.com"

# The database: `npx wrangler d1 create team7-material-finder-db` prints the id to paste here
[[d1_databases]]
binding = "DB"
database_name = "team7-material-finder-db"
database_id = "paste-the-id-from-wrangler-d1-create"

# File storage for the uploaded photos: `npx wrangler r2 bucket create team7-material-finder-images`
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "team7-material-finder-images"

# The password is NOT here: it is a secret.
# Local:   put APP_PASSWORD=... in a .dev.vars file (never commit it)
# Online:  npx wrangler pages secret put APP_PASSWORD
